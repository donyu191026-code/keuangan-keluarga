<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FDFCFA"><link rel="manifest" href="manifest.json">
<title>Ruang Keluarga — Keuangan</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#FDFCFA;color:#202020;font-family:Arial,sans-serif}
.wrap,.auth{max-width:760px;margin:auto;padding:20px 16px 90px}.auth{min-height:100vh;display:grid;place-items:center}
.card{background:#fff;border:1px solid #e9e5df;border-radius:20px;padding:20px}.auth .card{width:min(430px,100%)}
h1{margin:0 0 5px}p{color:#777}.balance{background:#315c4b;color:white;border-radius:20px;padding:22px;margin:18px 0}.balance h2{font-size:30px;margin:8px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#fff;border:1px solid #e9e5df;border-radius:16px;padding:16px}.income{color:#28734f}.expense{color:#b84b4b}
button,input,select{font:inherit}input,select{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:12px}
button{border:0;border-radius:12px;padding:13px;font-weight:700}.primary{background:#315c4b;color:#fff;width:100%;margin-top:8px}.link{background:none;color:#315c4b;padding:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.panel{margin-top:14px}
.tx{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #eee}.empty{text-align:center;color:#777;padding:25px}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:end}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:760px;margin:auto;border-radius:22px 22px 0 0;padding:20px}.close{float:right;background:#eee}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}
</style></head><body>

<div id="auth" class="auth"><div class="card">
<h1>Ruang Keluarga</h1><p>Keuangan Keluarga</p>
<div id="loginBox"><h2>Masuk</h2><input id="le" type="email" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button class="primary" onclick="login()">Masuk</button><p>Belum punya akun? <button class="link" onclick="registerBox()">Daftar</button></p></div>
<div id="regBox" class="hidden"><h2>Daftar</h2><input id="rn" placeholder="Nama lengkap"><input id="re" type="email" placeholder="Email"><input id="rp" type="password" placeholder="Password"><button class="primary" onclick="register()">Buat akun</button><p>Sudah punya akun? <button class="link" onclick="loginBox()">Masuk</button></p></div>
</div></div>

<main id="app" class="wrap hidden">
<div class="top"><div><h1>Ruang Keluarga</h1><p>Keuangan Keluarga</p></div><button onclick="logout()">Keluar</button></div>
<div class="balance"><small>Saldo saat ini</small><h2 id="bal">Rp0</h2></div>
<div class="stats"><div class="stat"><small>Pemasukan</small><strong id="inc" class="income">Rp0</strong></div><div class="stat"><small>Pengeluaran</small><strong id="exp" class="expense">Rp0</strong></div></div>
<div class="actions"><button class="primary" onclick="openModal()">+ Tambah Transaksi</button><button onclick="load()">↻ Refresh</button></div>
<div class="card panel"><h3>Transaksi Terbaru</h3><div id="list" class="empty">Memuat...</div></div>
</main>

<div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><h2>Tambah Transaksi</h2>
<select id="type"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select>
<input id="amount" type="number" placeholder="Nominal"><input id="date" type="date"><input id="desc" placeholder="Keterangan">
<button class="primary" onclick="save()">Simpan Transaksi</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script>
<script>
let sb,user;
const $=id=>document.getElementById(id),rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
function loginBox(){$("loginBox").classList.remove("hidden");$("regBox").classList.add("hidden")}
function registerBox(){$("loginBox").classList.add("hidden");$("regBox").classList.remove("hidden")}
async function init(){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let {data}=await sb.auth.getSession();if(data.session){user=data.session.user;$("auth").classList.add("hidden");$("app").classList.remove("hidden");load()}}
async function login(){let {error}=await sb.auth.signInWithPassword({email:$("le").value,password:$("lp").value});if(error)return alert(error.message);location.reload()}
async function register(){let {error}=await sb.auth.signUp({email:$("re").value,password:$("rp").value,options:{data:{full_name:$("rn").value}}});if(error)return alert(error.message);alert("Akun dibuat. Cek email jika konfirmasi email aktif.");loginBox()}
async function logout(){await sb.auth.signOut();location.reload()}
function openModal(){$("date").value=new Date().toISOString().slice(0,10);$("modal").classList.add("show")}function closeModal(){$("modal").classList.remove("show")}
async function save(){let amount=Number($("amount").value),type=$("type").value,date=$("date").value,description=$("desc").value;if(!amount||!date)return alert("Nominal dan tanggal wajib diisi");let {error}=await sb.from("transactions").insert({user_id:user.id,type,amount,transaction_date:date,description});if(error)return alert(error.message);$("amount").value="";$("desc").value="";closeModal();load()}
async function load(){let {data,error}=await sb.from("transactions").select("*").order("transaction_date",{ascending:false}).limit(50);if(error)return $("list").textContent=error.message;let i=0,e=0;(data||[]).forEach(x=>x.type==="income"?i+=+x.amount:e+=+x.amount);$("inc").textContent=rp(i);$("exp").textContent=rp(e);$("bal").textContent=rp(i-e);$("list").innerHTML=data.length?data.map(x=>`<div class="tx"><span><b>${x.description||"Tanpa keterangan"}</b><br><small>${x.transaction_date||""}</small></span><b class="${x.type}">${x.type==="income"?"+":"-"} ${rp(x.amount)}</b></div>`).join(""):"<div class='empty'>Belum ada transaksi.</div>"}
init();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
