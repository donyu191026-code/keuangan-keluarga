<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruang Keluarga - Keuangan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      <script>
const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

async function daftar(email, password, nama) {
    const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                full_name: nama
            }
        }
    });

    if (error) {
        alert("Gagal daftar: " + error.message);
        return;
    }

    alert("Pendaftaran berhasil. Silakan cek email untuk konfirmasi.");
}

async function login(email, password) {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        alert("Login gagal: " + error.message);
        return;
    }

    alert("Login berhasil!");
    location.reload();
}

async function logout() {
    await supabaseClient.auth.signOut();
    location.reload();
}

async function cekLogin() {
    const { data: { session } } =
        await supabaseClient.auth.getSession();

    if (session) {
        console.log("User login:", session.user.email);
    } else {
        console.log("Belum login");
    }
}

cekLogin();
</script>
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f7f5;
      color: #222;
    }

    .app {
      max-width: 1100px;
      margin: auto;
      min-height: 100vh;
      padding: 24px;
    }

    header {
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 6px;
    }

    header p {
      color: #777;
    }

    .balance {
      background: white;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    .balance small {
      color: #777;
    }

    .balance h2 {
      font-size: 32px;
      margin-top: 8px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .card small {
      color: #777;
    }

    .card strong {
      display: block;
      margin-top: 8px;
      font-size: 21px;
    }

    .income {
      color: #18794e;
    }

    .expense {
      color: #b42318;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      cursor: pointer;
      font-size: 15px;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: white;
      border: 1px solid #ddd;
    }

    .transactions {
      background: white;
      border-radius: 18px;
      padding: 20px;
    }

    .transactions h3 {
      margin-bottom: 16px;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 35px 10px;
    }

    @media (max-width: 600px) {
      .app {
        padding: 16px;
      }

      header h1 {
        font-size: 24px;
      }

      .balance h2 {
        font-size: 27px;
      }

      .summary {
        grid-template-columns: 1fr 1fr;
      }

      .actions {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>

<body>

  <main class="app">

    <header>
      <h1>Ruang Keluarga</h1>
      <p>Keuangan Keluarga</p>
    </header>

    <section class="balance">
      <small>Saldo Total</small>
      <h2 id="balance">Rp0</h2>
    </section>

    <section class="summary">
      <div class="card">
        <small>Pemasukan</small>
        <strong class="income" id="income">Rp0</strong>
      </div>

      <div class="card">
        <small>Pengeluaran</small>
        <strong class="expense" id="expense">Rp0</strong>
      </div>
    </section>

    <section class="actions">
      <button class="primary" onclick="alert('Fitur tambah transaksi akan kita buat berikutnya.')">
        + Tambah Transaksi
      </button>

      <button class="secondary" onclick="alert('Fitur laporan akan kita buat berikutnya.')">
        Lihat Laporan
      </button>
    </section>

    <section class="transactions">
      <h3>Transaksi Terbaru</h3>

      <div class="empty">
        Belum ada transaksi.
      </div>
    </section>

  </main>

</body>
</html>
